<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" role="img" aria-label="Loading">
  <title>Loading</title>

  <style>
    /* rotate the whole SVG group */
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* animate the dashoffset for a smooth "stroke sweep" */
    @keyframes dash {
      0% {
        stroke-dasharray: 1, 69.115;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 40, 69.115;
        stroke-dashoffset: -10;
      }
      100% {
        stroke-dasharray: 1, 69.115;
        stroke-dashoffset: -69.115;
      }
    }

    .spinner-group {
      transform-origin: 12px 12px; /* center of viewBox */
      animation: spin 1.4s linear infinite;
    }

    .track {
      stroke: rgba(34,197,94,0.18); /* green-400 at 20% opacity */
      stroke-width: 2.5;
      fill: none;
    }

    .arc {
      stroke: #22c55e; /* green-400 */
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
      /* circle perimeter ~ 2πr -&gt; for r=11 =&gt; ~69.115 */
      stroke-dasharray: 69.115;
      stroke-dashoffset: 0;
      animation: dash 1.6s ease-in-out infinite;
    }
  </style>

  <!-- group rotates -->
  <g class="spinner-group">
    <!-- background track -->
    <circle class="track" cx="12" cy="12" r="11"></circle>
    <!-- animated arc -->
    <circle class="arc" cx="12" cy="12" r="11"></circle>
  </g>
</svg>
